[technology-description]
cozy-garden-tower=Věž, která sama sází a sklízí plodiny.
cozy-root-logistics=Kořenové tunely a rozdělovače.
cozy-ant-workshop-1=Mravenci skládají, co jsi dřív vyráběl ručně.
cozy-spider-spinner=Pavouci spřádají hedvábí z vajec a cukru.
cozy-genome-sequencing=Sekvence genomu a sekvenátor DNA.
cozy-ant-workshop-2=Větší a rychlejší mravenčí kolonie.
cozy-mycelium-network=Houbové uzly, fotosyntetické listy a kvasné komory: energie pro velké živé budovy.
cozy-starch-tuber=Uchová energii na noc.
cozy-mycelium-network-2=Houbové uzly s delším dosahem.
cozy-mushroom-farm=Mycelium a nervová tkáň.
cozy-chitin=Mravenci chovají brouky kvůli jejich chitinovým krunýřům.
cozy-ant-workshop-3=Největší a nejrychlejší mravenčí kolonie.
cozy-crispr=Úprava genů: třetí vědecký balíček.
cozy-bee-hive=Úly, včely dělnice a čmeláci stavitelé.
cozy-honeycomb-logistics=Žádací, aktivní zásobovací a vyrovnávací plástve.
cozy-plant-oil=Trávicí komora lisuje olej z lněných semínek.
cozy-water-buildings=Řasová farma a rákosový filtr: budovy, které stojí přímo na vodě.
cozy-synthetic-genome=Genom napsaný od nuly: čtvrtý vědecký balíček.
cozy-lotus-reactor=Obří lotos na vodě, nejsilnější zdroj energie.
cozy-synthetic-enzymes=Trávicí komora vyrobí o 20 % víc.

[entity-description]
cozy-digester=Živý žaludek: rozkládá dřevo, plodiny a vápenec na pryskyřici, cukr a biocement. Jí cukr nebo seno.
agricultural-tower=Sází a sklízí stromy na dřevo. Jí cukr nebo seno.
cozy-ant-workshop-1=Mravenčí kolonie, která skládá výrobky. Jí cukr nebo seno.
cozy-ant-workshop-2=Větší a rychlejší mravenčí kolonie. Potřebuje síť podhoubí.
cozy-spider-spinner=Pavouci spřádají hedvábí. Jí cukr nebo seno.
cozy-sequencer=Čte vzorky DNA i sekvence genomu. Zkoumá dvakrát rychleji než genetická laboratoř. Potřebuje síť podhoubí.
lab=Zkoumá pomocí vzorků DNA. Jí cukr nebo seno.
small-electric-pole=Rozvádí energii sítí podhoubí.
medium-electric-pole=Rozvádí energii sítí podhoubí na delší vzdálenost.
solar-panel=Mění sluneční světlo na energii pro síť podhoubí.
accumulator=Ukládá energii sítě podhoubí jako škrob.
cozy-fermentation-chamber=Kvašením cukru nebo sena vyrábí energii pro síť podhoubí (300 kW).
cozy-mushroom-farm=Pěstuje mycelium na dřevě a seně. Jí cukr nebo seno.
cozy-ant-workshop-3=Největší a nejrychlejší mravenčí kolonie. Potřebuje síť podhoubí.
cozy-algae-farm=Stojí na vodě a ze slunce pěstuje řasy. Potřebuje síť podhoubí.
cozy-reed-filter=Stojí na vodě. Rákos z ní filtruje vápenec a cukr. Potřebuje síť podhoubí.
cozy-lotus-reactor=Obří lotos na vodě. Spaluje jídlo (nejlépe rostlinný olej) na energii pro síť podhoubí (1,5 MW).

[fuel-category-name]
cozy-food=Jídlo
