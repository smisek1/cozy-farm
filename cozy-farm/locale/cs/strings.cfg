[item-description]
cozy-garden-soil=Plodiny jdou zasadit jen do ornice.
cozy-chicken=Potřebná na stavbu kurníku. Další slepice se vylíhnou z vajec v kurníku.
cozy-cow=Potřebná na stavbu stáje. Další krávy odchováš ve stáji.
cozy-sheep=Potřebná na stavbu ovčína. Další ovce odchováš v ovčíně.
cozy-garden-tower=Sama sází semínka a sklízí plodiny v ornici kolem sebe.
cozy-sugar=Jídlo pro živé budovy (4 MJ).
cozy-hay=Krmivo pro zvířata a jídlo pro živé budovy (1 MJ).
cozy-digester=Živý žaludek: rozkládá dřevo, plodiny a vápenec na pryskyřici, cukr a biocement. Jí cukr nebo seno.
burner-inserter=Živý chapadlovitý podavač. Jí cukr nebo seno.

