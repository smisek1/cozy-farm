[mod-description]
cozy-farm=Odpočinkové farmaření: záhony, mrkev, brambory, pšenice, rajčata a dýně, kurník, stáj a ovčín, mlýn a kuchyně. Začneš ručně, skončíš u zahradních věží a pásů – všechno jde zautomatizovat.

