[item-description]
cozy-garden-soil=Crops can only be planted on garden soil.
cozy-chicken=Needed to build a chicken coop. More chickens hatch from eggs in the coop.
cozy-cow=Needed to build a barn. Breed more in the barn.
cozy-sheep=Needed to build a sheep pen. Breed more in the pen.
cozy-garden-tower=Plants seeds and harvests crops on garden soil around itself.
cozy-sugar=Food for living buildings (4 MJ).
cozy-hay=Animal feed and food for living buildings (1 MJ).
cozy-digester=A living stomach: breaks wood, crops and limestone down into resin, sugar and biocement. Eats sugar or hay.
burner-inserter=A living grabber. Eats sugar or hay.
cozy-dna-sample=Science pack 1: a sample of plant and animal DNA.
cozy-genome-sequence=Science pack 2: a fully read genome. Only the DNA sequencer understands it.
cozy-nerve-tissue=Living "circuits" made of mycelium and silk.
cozy-chitin=Hard insect shell, the living steel.
cozy-crispr-kit=Science pack 3: gene scissors made from bacteria.

