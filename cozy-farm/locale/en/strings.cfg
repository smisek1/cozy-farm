[mod-name]
cozy-farm=Cozy Farm

[mod-description]
cozy-farm=Relaxed farming: garden beds, carrots, potatoes, wheat, tomatoes and pumpkins, a chicken coop, barn and sheep pen, a mill and a kitchen. Start by hand, end with garden towers and belts – everything can be automated.

[item-group-name]
cozy-farm=Farm

[cozy-farm]
welcome=[item=cozy-pumpkin] Cozy Farm: you got garden soil, seeds and a few animals. Lay soil, plant seeds on it and harvest when they're grown!

