[mod-description]
cozy-farm=Relaxed farming: garden beds, carrots, potatoes, wheat, tomatoes and pumpkins, a chicken coop, barn and sheep pen, a mill and a kitchen. Start by hand, end with garden towers and belts – everything can be automated.

[item-group-name]
